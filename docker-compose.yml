version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/easyride_db
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8001
      - DISPATCH_ENGINE_URL=http://dispatch-engine:8002
    depends_on:
      - postgres
      - redis
      - ml-service
      - dispatch-engine

  dispatch-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.dispatch-engine
    ports:
      - "8002:8002"

  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml-service
    ports:
      - "8001:8001"

  postgres:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_DB: easyride_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
